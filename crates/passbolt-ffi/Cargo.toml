[package]
name = "passbolt-ffi"
version = "0.1.0"
edition = "2021"
rust-version = "1.87"
description = "Passbolt SDK — Multi-language FFI bindings (Python, Kotlin, Swift, C#)"
license = "AGPL-3.0-or-later"

[lib]
crate-type = ["cdylib", "lib"]
name = "passbolt_ffi"

[[bin]]
name = "uniffi-bindgen"
path = "uniffi-bindgen.rs"

[dependencies]
passbolt-sdk = { path = "../passbolt-sdk", features = ["native"] }
uniffi = { version = "0.29", features = ["cli"] }
tokio = { version = "1", features = ["rt-multi-thread"] }
secrecy = "0.10"
chrono = "0.4"
totp-rs = "5"
zeroize = "1"

[dev-dependencies]
rstest = "0.28"
serde = "1"
serde_json = "1"

[lints]
workspace = true
