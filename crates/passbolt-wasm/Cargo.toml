[package]
name = "passbolt-wasm"
version = "0.1.0"
edition = "2021"
description = "Passbolt SDK — WASM binding for browser extensions"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
passbolt-sdk = { path = "../passbolt-sdk", default-features = false }

# WASM bindings
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
serde-wasm-bindgen = "0.6"

# Web APIs
web-sys = { version = "0.3", features = [
    "Headers",
    "Request",
    "RequestInit",
    "RequestCredentials",
    "RequestMode",
    "Response",
    "Window",
] }
js-sys = "0.3"

# Serde for type conversion
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# CRITICAL: enables crypto.getRandomValues() for rand/pgp in WASM
getrandom = { version = "0.2", features = ["js"] }
secrecy = "0.10.3"

[lints]
workspace = true
