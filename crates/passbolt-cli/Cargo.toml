[package]
name = "passbolt-cli"
version = "0.1.0"
edition = "2021"
description = "Passbolt CLI — Rust alternative to go-passbolt-cli"
license = "AGPL-3.0-or-later"

[[bin]]
name = "passbolt"
path = "src/main.rs"

[dependencies]
# SDK
passbolt-sdk = { path = "../passbolt-sdk", features = ["native", "totp"] }

# CLI
clap = { version = "4", features = ["derive", "env"] }
clap_complete = "4"
clap_mangen = "0.2"
clap-markdown = "0.1"

# Async
tokio = { version = "1", features = ["full"] }

# Erreurs
anyhow = "1"

# Sécurité mémoire
secrecy = { version = "0.10", features = ["serde"] }

# Sérialisation
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Config & paths
config = "0.14"
directories = "5"
toml = "0.8"
zeroize = { version = "1", features = ["derive"] }

# Output
comfy-table = "6"
colored = "2"
indicatif = "0.17"

# Utils
rpassword = "7"
totp-rs = { version = "5", features = ["gen_secret"] }
chrono = { version = "0.4", features = ["serde"] }

# KeePass export
keepass = { version = "0.6", features = ["save_kdbx4"] }
secstr = "0.5"
pgp = "0.14"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
mockito = "1"
tokio-test = "0.4"
tempfile = "3"

[lints]
workspace = true
